# convergence setup
num.ergm.convergence.attempts: 10 #change this to step2.num.ergm.convergence.attempts
ergm.convergence.attempt.time: 60 #minutes  #change this to step2.ergm.convergence.attempt.time
max.random.seed: 200
sbatch.partition: 'normal' # short, normal, 
sbatch.walltime.hours: '10' # make sure it is large enough to account for the convergence attempt time times the number of convergence attempts
sbatch.walltime.minutes: '30'
sbatch.email: 'tom.wolff@northwestern.edu'
sbatch.memory: '3G'
convergence.fail.fname: 'edge_calibration_sets_that_did_not_converge.txt'

# simulation setup
sbatch.partition.sim: 'normal' # short, normal, 
sbatch.walltime.hours.sim: '10' # make sure it is large enough to account for the convergence attempt time times the number of convergence attempts
sbatch.walltime.minutes.sim: '30'
sbatch.email.sim: 'tom.wolff@northwestern.edu'
sbatch.memory.sim: '3G'


